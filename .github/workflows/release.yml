# On a version tag, publish the skill folder as a release asset, so claude.ai,
# Claude Desktop, Codex and projects install it without cloning anything.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the skill
        run: make skill
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/epfl-design.zip dist/epfl-design.skill --generate-notes
