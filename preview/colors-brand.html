<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Brand colors" subtitle="Red (web + print) and teal accents" viewport="700x160" -->
<html lang="en"><head><meta charset="utf-8"><title>Colors — Brand</title>
<link rel="stylesheet" href="../css/epfl.css">
<style>
  body { margin: 0; padding: 24px; }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .swatch { flex: 1; min-width: 0; border: 1px solid var(--border-subtle); border-radius: var(--radius); overflow: hidden; }
  .chip { height: 70px; }
  .meta { padding: 8px 10px; font-size: 11px; line-height: 1.4; }
  .meta b { display: block; font-size: 12px; font-weight: 700; color: var(--fg); margin-bottom: 2px; }
  .meta code { font-family: var(--font-mono); color: var(--fg-muted); font-size: 10.5px; }
</style></head>
<body>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#FF0000"></div><div class="meta"><b>Red (web)</b><code>#FF0000</code></div></div>
    <div class="swatch"><div class="chip" style="background:#B51F1F"></div><div class="meta"><b>Red dark</b><code>#B51F1F</code></div></div>
    <div class="swatch"><div class="chip" style="background:#E30713"></div><div class="meta"><b>Red (print)</b><code>#E30713</code></div></div>
    <div class="swatch"><div class="chip" style="background:#92000E"></div><div class="meta"><b>Red print dark</b><code>#92000E</code></div></div>
    <div class="swatch"><div class="chip" style="background:#007480"></div><div class="meta"><b>Canard</b><code>#007480</code></div></div>
    <div class="swatch"><div class="chip" style="background:#004248"></div><div class="meta"><b>Canard dark</b><code>#004248</code></div></div>
    <div class="swatch"><div class="chip" style="background:#00A79F"></div><div class="meta"><b>Léman</b><code>#00A79F</code></div></div>
  </div>
</body></html>
