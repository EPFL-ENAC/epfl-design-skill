<!DOCTYPE html>
<!-- @dsCard group="Components" name="Alerts" subtitle="Info / success / warning / danger" viewport="700x200" -->
<html lang="en"><head><meta charset="utf-8"><title>Alerts</title>
<link rel="stylesheet" href="../skills/epfl-design/css/epfl.css">
<style>
  body { margin: 0; padding: var(--space-3); font-size: var(--fs-sm); display: flex; flex-direction: column; gap: var(--space-2); }
</style></head>
<body>
  <div class="epfl-alert epfl-alert-info"><b>Info.</b> The application deadline is approaching.</div>
  <div class="epfl-alert epfl-alert-success"><b>Success.</b> Your registration was confirmed.</div>
  <div class="epfl-alert epfl-alert-warning"><b>Warning.</b> Some sessions are nearly full.</div>
  <div class="epfl-alert epfl-alert-danger"><b>Error.</b> Submission failed — please check the form.</div>
</body></html>
