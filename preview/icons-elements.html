<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Elements custom icons" subtitle="Project-custom UI icons not covered by Feather" viewport="700x110" -->
<html lang="en"><head><meta charset="utf-8"><title>Iconography — Elements custom UI</title>
<link rel="stylesheet" href="../css/epfl.css">
<style>
  body { margin: 0; padding: 14px 20px; font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; }
  .icon { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border: 1px solid var(--border-subtle); border-radius: var(--radius); background: #fff; }
  .icon img { width: 22px; height: 22px; }
  .icon span { font-size: 9px; color: var(--fg-muted); font-family: var(--font-mono); text-align: center; word-break: break-all; }
</style></head>
<body>
  <div class="grid">
    <div class="icon"><img src="../assets/icons/arrow-left.svg" alt=""><span>arrow-l</span></div>
    <div class="icon"><img src="../assets/icons/arrow-right.svg" alt=""><span>arrow-r</span></div>
    <div class="icon"><img src="../assets/icons/chevron-left.svg" alt=""><span>chev-l</span></div>
    <div class="icon"><img src="../assets/icons/chevron-right.svg" alt=""><span>chev-r</span></div>
    <div class="icon"><img src="../assets/icons/chevron-top.svg" alt=""><span>chev-t</span></div>
    <div class="icon"><img src="../assets/icons/chevron-bottom.svg" alt=""><span>chev-b</span></div>
    <div class="icon"><img src="../assets/icons/close.svg" alt=""><span>close</span></div>
    <div class="icon"><img src="../assets/icons/browse.svg" alt=""><span>browse</span></div>
    <div class="icon"><img src="../assets/icons/accessibility.svg" alt=""><span>access</span></div>
    <div class="icon"><img src="../assets/icons/elements.svg" alt=""><span>elements</span></div>
    <div class="icon"><img src="../assets/icons/bluesky.svg" alt=""><span>bluesky</span></div>
  </div>
</body></html>
