<!DOCTYPE html>
<!-- @dsCard group="Brand" name="EPFL illustrative icons" subtitle="Bespoke campus & character pictograms" viewport="700x180" -->
<html lang="en"><head><meta charset="utf-8"><title>Iconography — EPFL Bespoke</title>
<link rel="stylesheet" href="../skills/epfl-design/css/epfl.css">
<style>
  body { margin: 0; padding: 14px 20px; font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; }
  .icon { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; }
  .icon img { width: 56px; height: 56px; }
  .icon span { font-size: 9px; color: var(--fg-muted); font-family: var(--font-mono); text-align: center; }
</style></head>
<body>
  <div class="grid">
    <div class="icon"><img src="../skills/epfl-design/assets/icons/epfl-architecture-stone-rolex.svg" alt=""><span>rolex</span></div>
    <div class="icon"><img src="../skills/epfl-design/assets/icons/epfl-architecture-building-campus-stcc.svg" alt=""><span>swisstech</span></div>
    <div class="icon"><img src="../skills/epfl-design/assets/icons/epfl-architecture-building-campus-pavillon.svg" alt=""><span>pavilion</span></div>
    <div class="icon"><img src="../skills/epfl-design/assets/icons/epfl-architecture-building-campus-innovation-park.svg" alt=""><span>i-park</span></div>
    <div class="icon"><img src="../skills/epfl-design/assets/icons/epfl-character-person-group.svg" alt=""><span>group</span></div>
    <div class="icon"><img src="../skills/epfl-design/assets/icons/epfl-character-person-scientist.svg" alt=""><span>scientist</span></div>
    <div class="icon"><img src="../skills/epfl-design/assets/icons/epfl-character-smiley-happy.svg" alt=""><span>smiley</span></div>
    <div class="icon"><img src="../skills/epfl-design/assets/icons/epfl-corporate-cdh.svg" alt=""><span>cdh</span></div>
  </div>
</body></html>
