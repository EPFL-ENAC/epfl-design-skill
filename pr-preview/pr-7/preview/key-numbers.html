<!DOCTYPE html>
<!-- @dsCard group="Components" name="Key numbers" subtitle="Large light numerals with red accent bar" viewport="700x200" -->
<html lang="en"><head><meta charset="utf-8"><title>Key Numbers</title>
<link rel="stylesheet" href="../skills/epfl-design/css/epfl.css">
<style>
  body { margin: 0; padding: var(--space-4); }
</style></head>
<body>
  <div class="epfl-keynumbers">
    <div class="epfl-keynumber">
      <div class="epfl-keynumber-num"><span class="pre">+</span>13 000</div>
      <div class="epfl-keynumber-bar"></div>
      <div class="epfl-keynumber-label">Students from over 120 countries</div>
    </div>
    <div class="epfl-keynumber">
      <div class="epfl-keynumber-num">350</div>
      <div class="epfl-keynumber-bar"></div>
      <div class="epfl-keynumber-label">Research labs across seven schools</div>
    </div>
    <div class="epfl-keynumber">
      <div class="epfl-keynumber-num">3</div>
      <div class="epfl-keynumber-bar"></div>
      <div class="epfl-keynumber-label">Missions: Education · Research · Innovation</div>
    </div>
  </div>
</body></html>
