<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Feather icons" subtitle="Primary UI icon set — 24px, 2px stroke, currentColor" viewport="700x200" -->
<html lang="en"><head><meta charset="utf-8"><title>Iconography — Feather (UI)</title>
<link rel="stylesheet" href="../css/epfl.css">
<script src="https://cdn.jsdelivr.net/npm/feather-icons@4.29.0/dist/feather.min.js"></script>
<style>
  body { margin: 0; padding: 14px 20px; font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; }
  .icon { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border: 1px solid var(--border-subtle); border-radius: var(--radius); background: #fff; }
  .icon i, .icon svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; color: var(--fg); }
  .icon span { font-size: 9px; color: var(--fg-muted); font-family: var(--font-mono); text-align: center; word-break: break-all; }
</style></head>
<body>
  <div class="grid">
    <div class="icon"><i data-feather="search"></i><span>search</span></div>
    <div class="icon"><i data-feather="menu"></i><span>menu</span></div>
    <div class="icon"><i data-feather="x"></i><span>x</span></div>
    <div class="icon"><i data-feather="chevron-right"></i><span>chev-r</span></div>
    <div class="icon"><i data-feather="chevron-down"></i><span>chev-d</span></div>
    <div class="icon"><i data-feather="arrow-right"></i><span>arr-r</span></div>
    <div class="icon"><i data-feather="external-link"></i><span>ext-link</span></div>
    <div class="icon"><i data-feather="download"></i><span>download</span></div>
    <div class="icon"><i data-feather="mail"></i><span>mail</span></div>
    <div class="icon"><i data-feather="phone"></i><span>phone</span></div>
    <div class="icon"><i data-feather="map-pin"></i><span>map-pin</span></div>
    <div class="icon"><i data-feather="calendar"></i><span>calendar</span></div>
    <div class="icon"><i data-feather="clock"></i><span>clock</span></div>
    <div class="icon"><i data-feather="user"></i><span>user</span></div>
    <div class="icon"><i data-feather="users"></i><span>users</span></div>
    <div class="icon"><i data-feather="info"></i><span>info</span></div>
    <div class="icon"><i data-feather="alert-triangle"></i><span>alert</span></div>
    <div class="icon"><i data-feather="check"></i><span>check</span></div>
    <div class="icon"><i data-feather="play"></i><span>play</span></div>
    <div class="icon"><i data-feather="filter"></i><span>filter</span></div>
  </div>
  <script>feather.replace();</script>
</body></html>
