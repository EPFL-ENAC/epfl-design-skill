<!DOCTYPE html>
<!-- @dsCard group="Type" name="Quotes & inline" subtitle="Blockquote, mark, ins/del, code" viewport="700x200" -->
<html lang="en"><head><meta charset="utf-8"><title>Type — Quotes & Inline</title>
<link rel="stylesheet" href="../css/epfl.css">
<style>
  body { margin: 0; padding: 20px 24px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  blockquote, .blockquote { font-size: 1.1rem; margin: 0; padding-left: 1rem; border-left: 1px solid var(--border); }
  .blockquote-footer { font-size: 12px; color: var(--fg-muted); margin-top: 8px; }
  .inline p { margin: 0 0 4px; font-size: 14px; }
  mark { background: var(--mark-bg); padding: 0 .2em; }
  .label { font-size: 10px; color: var(--fg-muted); font-family: var(--font-mono); margin-bottom: 6px; }
</style></head>
<body>
  <div class="grid">
    <div>
      <div class="label">.blockquote</div>
      <blockquote class="blockquote">
        <p>Reality is that which, when you stop believing in it, doesn't go away.</p>
        <footer class="blockquote-footer">— Philip K. Dick</footer>
      </blockquote>
    </div>
    <div class="inline">
      <div class="label">Inline elements</div>
      <p>You can <mark>highlight</mark> text.</p>
      <p><del>Deleted</del>, <s>no longer accurate</s>, <ins>added</ins>.</p>
      <p><strong>Bold</strong>, <em>italic</em>, <abbr title="Abbreviation">Abbr</abbr>.</p>
      <p><code>const x = 1</code> — code in red.</p>
    </div>
  </div>
</body></html>
