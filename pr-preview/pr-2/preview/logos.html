<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Logos" subtitle="EPFL wordmark — positive and negative" viewport="700x200" -->
<html lang="en"><head><meta charset="utf-8"><title>Logos</title>
<link rel="stylesheet" href="../css/epfl.css">
<style>
  body { margin: 0; padding: 24px; font-family: var(--font-sans); display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .panel { padding: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  .light { background: #fff; }
  .dark { background: var(--epfl-black); color: #fff; }
  .panel img { height: 40px; }
  .label { font-size: 10px; opacity: .6; font-family: var(--font-mono); }
</style></head>
<body>
  <div class="panel light"><img src="../assets/svg/epfl-logo.svg" alt="EPFL"><div class="label">epfl-logo.svg</div></div>
  <div class="panel dark"><img src="../assets/svg/epfl-logo-negative.svg" alt="EPFL"><div class="label">epfl-logo-negative.svg</div></div>
</body></html>
